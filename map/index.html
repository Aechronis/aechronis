<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aechronis · World Map</title>
  <link rel="preload" href="css/fonts/CormorantGaramond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#252b28">
</head>

<body>

  <div id="map"></div>

  <section id="panels" aria-label="Selection details">
    <div class="panel-toolbar">
      <h2 id="nation-title"></h2>
      <button id="panels-close" type="button" aria-label="Close panels" title="Close (Esc)">&times;</button>
    </div>
    <div class="panel-tabs" role="tablist" aria-label="Selection details">
      <button id="nation-tab" type="button" role="tab" aria-controls="nation-panel" aria-selected="true" data-panel-tab="nation">Nation</button>
      <button id="town-tab" type="button" role="tab" aria-controls="town-panel" aria-selected="false" tabindex="-1" data-panel-tab="town">Town</button>
      <button id="territory-tab" type="button" role="tab" aria-controls="territory-panel" aria-selected="false" tabindex="-1" data-panel-tab="territory">Territory</button>
    </div>
    <div class="panel-body">
      <section id="nation-panel" class="info-panel empty" role="tabpanel" aria-labelledby="nation-tab" tabindex="0"></section>
      <section id="town-panel" class="info-panel empty" role="tabpanel" aria-labelledby="town-tab" tabindex="0" hidden></section>
      <section id="territory-panel" class="info-panel empty" role="tabpanel" aria-labelledby="territory-tab" tabindex="0" hidden></section>
    </div>
  </section>

  <div id="coords" hidden></div>

  <section id="map-mode-control" aria-label="Map modes">
    <select id="map-mode" aria-label="Map mode">
      <option value="political">Political</option>
      <option value="towns">Towns</option>
      <option value="relations">Relations</option>
      <option value="resources">Resources</option>
    </select>
    <div id="map-mode-buttons" role="group" aria-label="Map mode" hidden>
      <button type="button" data-map-mode="political" aria-label="Political" aria-pressed="true" title="Show political borders">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/></svg>
      </button>
      <button type="button" data-map-mode="towns" aria-label="Towns" aria-pressed="false" title="Show towns and their borders">
        <!-- Lucide landmark; license: /licenses/lucide.txt -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 18v-7M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949ZM14 18v-7M18 18v-7M3 22h18M6 18v-7"/></svg>
      </button>
      <button type="button" data-map-mode="relations" aria-label="Relations" aria-pressed="false" title="Select a nation to see its diplomatic relations">
        <!-- Lucide handshake; license: /licenses/lucide.txt -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3M3 4h8"/></svg>
      </button>
      <button type="button" data-map-mode="resources" aria-label="Resources" aria-pressed="false" title="Show territory resource images">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 9-9 10a1.4 1.4 0 0 0 2 2l10-9M5 3c8-1 17 8 16 16-3-7-9-13-16-16Z"/></svg>
      </button>
    </div>
  </section>

  <div id="loading" role="status" aria-label="Loading world map">
    <img src="logo.png" width="40" height="40" alt="" aria-hidden="true">
    <span>Loading map…</span>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
