        <use href="#leaf" transform="translate(60 208) rotate(-12) scale(-.57 .57)"/>
        <use href="#leaf" transform="translate(36 182) rotate(-53) scale(.64)"/>
        <use href="#leaf" transform="translate(23 156) rotate(25) scale(-.59 .59)"/>
        <use href="#leaf" transform="translate(18 133) rotate(-18) scale(.57)"/>
        <use href="#leaf" transform="translate(22 107) rotate(42) scale(-.5 .5)"/>
        <use href="#leaf" transform="translate(31 80) rotate(12) scale(.48)"/>
      </g>
      <path d="M69 215C53 214 48 223 55 224C60 225 61 219 56 218M30 173C14 179 10 168 15 165M20 114C8 111 9 101 14 103M28 88C37 84 39 76 35 75"
