      <use href="#leaf" transform="translate(93 226) rotate(-64) scale(.85)"/>
      <use href="#leaf" transform="translate(79 220) rotate(-48) scale(-1.04 1.04)"/>
      <use href="#leaf" transform="translate(65 213) rotate(-42) scale(1)"/>
      <use href="#leaf" transform="translate(53 203) rotate(-36) scale(-1.16 1.16)"/>
      <use href="#leaf" transform="translate(41 190) rotate(-27) scale(1.04)"/>
      <use href="#leaf" transform="translate(32 176) rotate(-20) scale(-1.2 1.2)"/>
      <use href="#leaf" transform="translate(24 158) rotate(-8) scale(1)"/>
      <use href="#leaf" transform="translate(19 140) rotate(3) scale(-1.18 1.18)"/>
      <use href="#leaf" transform="translate(19 121) rotate(15) scale(.94)"/>
      <use href="#leaf" transform="translate(22 103) rotate(21) scale(-1.08 1.08)"/>
      <use href="#leaf" transform="translate(28 86) rotate(30) scale(.8)"/>
      <use href="#leaf" transform="translate(35 68) rotate(35) scale(.82)"/>
      <use href="#leaf" transform="translate(43 53) rotate(42) scale(.65)"/>
      <use href="#leaf" transform="translate(52 40) rotate(48) scale(.46)"/>
      <!-- Overlapping inner foliage bridges the portrait and the outer branches. -->
      <use href="#leaf" transform="translate(88 226) rotate(-37) scale(-.82 .82)"/>
      <use href="#leaf" transform="translate(66 216) rotate(-15) scale(-.92 .92)"/>
      <use href="#leaf" transform="translate(43 193) rotate(6) scale(-.94 .94)"/>
      <use href="#leaf" transform="translate(27 163) rotate(18) scale(-.92 .92)"/>
      <use href="#leaf" transform="translate(21 128) rotate(32) scale(-.88 .88)"/>
      <use href="#leaf" transform="translate(25 93) rotate(42) scale(-.78 .78)"/>
      <use href="#leaf" transform="translate(36 64) rotate(50) scale(-.62 .62)"/>
      <g fill="url(#rim)" stroke="#725021" stroke-width=".45">
