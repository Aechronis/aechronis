      <path d="M-.5-1C-5-8-5-17-8-25" stroke="#ffedb1" stroke-width=".85" stroke-linecap="round"/>
      <path d="M.1-1C-4.1-8-4.3-17-7.3-24" stroke="#6c481b" stroke-width=".5"/>
      <path d="M-1-3C-4-9-4-17-7.5-25L-5-18-3-16-4-12-2-9Z" fill="#fff0b5" opacity=".22"/>
      <path d="M-2-5-7-6M-3.2-8-9.8-10M-4-11-11.5-14M-4.8-15-10.6-18M-5.8-19-10-21M-2-5-.8-7M-3.2-9-1.4-12M-4.3-13-2.4-16M-5.4-17-3.6-20"
        stroke="#68471c" stroke-opacity=".65" stroke-width=".45" stroke-linecap="round"/>
      <path d="M-4-6-6-8M-5-9-7-12M-6-12-9-15M-7-16-9-19M-5-7-8-7M-7-11-10-11M-8-14-11-15M-2-7-1-9M-3-11-2-14M-4-15-4-18"
        stroke="#f5d98d" stroke-opacity=".8" stroke-width=".35" stroke-linecap="round"/>
      <path d="M-9-6-8-8-11-10M-12-11-10-13-13-15M-12-18-11-20M-2-18-4-17M-1-14-3-13"
        stroke="#fff0bc" stroke-opacity=".7" stroke-width=".45"/>
      <path d="M-8.5-8-11-10M-10-12-12.5-15M-10.5-18-11-20M-6.8-22-7.5-25"
