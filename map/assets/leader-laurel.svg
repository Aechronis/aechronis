<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="gold" x1="-15" y1="-22" x2="2" y2="-4" gradientUnits="userSpaceOnUse">
