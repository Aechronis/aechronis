      <stop offset=".24" stop-color="#c19438"/>
      <stop offset=".43" stop-color="#ffe9a4"/>
      <stop offset=".53" stop-color="#dcba60"/>
      <stop offset=".7" stop-color="#9a6824"/>
      <stop offset="1" stop-color="#edc976"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efcf7b"/>
      <stop offset=".32" stop-color="#9c712c"/>
      <stop offset=".52" stop-color="#f7dc8c"/>
      <stop offset=".76" stop-color="#73501e"/>
      <stop offset="1" stop-color="#d3ab55"/>
    </linearGradient>
    <filter id="relief" x="-20%" y="-20%" width="140%" height="140%">
