    <path d="M93 225q7 5 14 0l-2 7q-5 3-10 0Z" fill="url(#rim)" stroke="#765322" stroke-width=".7"/>
    <path d="m96 226 1 6m3-5v6m3-7-1 6" stroke="#fff0b2" stroke-opacity=".7" stroke-width=".7"/>
    <path d="M96 231q-5 2-9 1l4 4 6-3M104 231q5 2 9 1l-4 4-6-3" fill="url(#rim)" stroke="#765322" stroke-width=".6"/>
  </g>
</svg>
