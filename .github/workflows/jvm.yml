name: JVM

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "modules/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/jvm.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Check and build JVM project JARs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew build serverDistributionZip --no-daemon
      - name: Upload runnable server layout
        uses: actions/upload-artifact@v7
        with:
          name: aechronis-server
          path: |
            build/distributions/aechronis/
            build/distributions/aechronis-server.zip
          include-hidden-files: true
          if-no-files-found: error
