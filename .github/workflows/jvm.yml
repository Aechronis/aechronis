name: JVM

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "modules/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/jvm.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Check JVM projects and build server
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew check :server:shadowJar --no-daemon
      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: aechronis-server
          path: server/build/libs/aechronis-all.jar
          if-no-files-found: error
