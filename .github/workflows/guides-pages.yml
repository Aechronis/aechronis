name: Guides Pages

on:
  # Keep deployment manual until Pages and the public custom domain are cut over
  # from the existing public guides repository.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.48
    defaults:
      run:
        working-directory: guides
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: cargo install --locked --version "$MDBOOK_VERSION" mdbook
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build guides
        run: mdbook build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: guides/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
