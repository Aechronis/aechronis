name: Server release

on:
  push:
    tags:
      - "server-*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Check and build JVM project JARs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew build assembleServerDistribution --no-daemon
      - name: Create server release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/distributions/aechronis/aechronis.jar \
            build/distributions/aechronis/modules/*.jar \
            build/distributions/aechronis/modules/.required-modules \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Server build $GITHUB_SHA. Deploy aechronis.jar at the server root and all other JARs plus .required-modules in modules/."
